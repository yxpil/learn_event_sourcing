<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event sourcing architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- commands -->
  <rect x="60" y="40" width="200" height="40" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="65" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">command: create order</text>
  <rect x="60" y="100" width="200" height="40" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">command: deduct balance</text>
  <rect x="60" y="160" width="200" height="40" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">command: deduct stock</text>

  <!-- event log -->
  <rect x="360" y="60" width="280" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">event log (append-only)</text>
  <g font-size="11.5" fill="#1f2937">
    <rect x="385" y="105" width="230" height="26" rx="5" fill="#fff" stroke="#2563eb"/><text x="500" y="122" text-anchor="middle">1. OrderCreated{u_alice, 199.5}</text>
    <rect x="385" y="138" width="230" height="26" rx="5" fill="#fff" stroke="#2563eb"/><text x="500" y="155" text-anchor="middle">2. BalanceDeducted{199.5}</text>
    <rect x="385" y="171" width="230" height="26" rx="5" fill="#fff" stroke="#2563eb"/><text x="500" y="188" text-anchor="middle">3. StockDeducted{qty=1}</text>
  </g>
  <text x="500" y="222" text-anchor="middle" font-size="10.5" fill="#64748b">events never updated, only appended</text>

  <line x1="260" y1="60" x2="360" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="260" y1="120" x2="360" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="260" y1="180" x2="360" y2="184" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- replay -->
  <rect x="720" y="100" width="230" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="835" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">replay → current state</text>
  <text x="835" y="150" text-anchor="middle" font-size="11" fill="#166534">status=PAID · balance=199.5</text>
  <text x="835" y="168" text-anchor="middle" font-size="11" fill="#166534">stock=1 · user=u_alice</text>
  <line x1="640" y1="150" x2="720" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- read model -->
  <rect x="360" y="290" width="600" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="660" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">read model (replay all streams)</text>
  <text x="380" y="345" font-size="11.5" fill="#334155">per-user order summary: u_alice → [o_001 PAID 199.5]   u_bob → [o_002 CANCELLED 50.0]</text>
  <text x="380" y="370" font-size="11.5" fill="#64748b">state is derived, never stored directly. Rebuild anytime, any shape.</text>
</svg>
</body>
</html>
