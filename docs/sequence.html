<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event sourcing sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="40" y="20" width="130" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="105" y="41" text-anchor="middle" fill="#92400e">client</text>
    <rect x="230" y="20" width="130" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="295" y="41" text-anchor="middle" fill="#1d4ed8">Order aggregate</text>
    <rect x="430" y="20" width="130" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="495" y="41" text-anchor="middle" fill="#15803d">event store</text>
    <rect x="630" y="20" width="160" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="710" y="41" text-anchor="middle" fill="#0f172a">read model</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="105" y1="52" x2="105" y2="430"/>
    <line x1="295" y1="52" x2="295" y2="430"/>
    <line x1="495" y1="52" x2="495" y2="430"/>
    <line x1="710" y1="52" x2="710" y2="430"/>
  </g>

  <!-- append events -->
  <line x1="105" y1="80" x2="290" y2="80" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="197" y="74" text-anchor="middle" font-size="11" fill="#1e40af">create order</text>
  <line x1="295" y1="105" x2="490" y2="105" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="392" y="99" text-anchor="middle" font-size="11" fill="#15803d">append OrderCreated</text>

  <line x1="105" y1="135" x2="290" y2="135" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="197" y="129" text-anchor="middle" font-size="11" fill="#1e40af">deduct balance</text>
  <line x1="295" y1="160" x2="490" y2="160" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="392" y="154" text-anchor="middle" font-size="11" fill="#15803d">append BalanceDeducted</text>

  <line x1="105" y1="190" x2="290" y2="190" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="197" y="184" text-anchor="middle" font-size="11" fill="#1e40af">deduct stock</text>
  <line x1="295" y1="215" x2="490" y2="215" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="392" y="209" text-anchor="middle" font-size="11" fill="#15803d">append StockDeducted</text>

  <!-- replay -->
  <line x1="495" y1="260" x2="295" y2="260" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="395" y="254" text-anchor="middle" font-size="11" fill="#15803d">load events → replay → state</text>
  <line x1="295" y1="290" x2="105" y2="290" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="200" y="284" text-anchor="middle" font-size="11" fill="#1e40af">return PAID state</text>

  <!-- read model -->
  <line x1="495" y1="330" x2="710" y2="330" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="602" y="324" text-anchor="middle" font-size="11" fill="#15803d">replay all streams → per-user summary</text>

  <text x="500" y="390" text-anchor="middle" font-size="11.5" fill="#64748b">State is never stored directly; it is always the replay of an immutable event log.</text>
</svg>
</body>
</html>
